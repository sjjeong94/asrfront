[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "asrfront"
version = "0.1.0"
description = "Super-fast, dependency-free C frontends (log-mel, kaldi fbank) for Whisper and SenseVoice ASR models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sjjeong94" }]
keywords = ["asr", "speech", "whisper", "sensevoice", "fbank", "mel-spectrogram", "kaldi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/sjjeong94/asrfront"
Issues = "https://github.com/sjjeong94/asrfront/issues"

[dependency-groups]
bench = [
    "kaldi-native-fbank>=1.22.3",
    "librosa>=0.11.0",
]
dev = [
    "clang-format>=23.1.3",
    "cmake>=4.4.4",
    "mypy>=1.19.1",
    "ninja>=1.13.2",
    "pytest>=7",
    "ruff>=0.6",
]
load = [
    "imageio-ffmpeg==0.6.0",  # bundles ffmpeg 7.0.2 (reference for asrfront.load)
]
ref = [
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/asrfront"]
# Stable ABI: one cp312-abi3 wheel serves CPython 3.12+; older Pythons get regular wheels.
wheel.py-api = "cp312"
wheel.exclude = ["asrfront/_ext.cpp"]

[tool.cibuildwheel]
# cp39-cp311 regular wheels + cp312 abi3 (also used for 3.13+, tested via test-skip below).
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*"]
skip = ["*-win32", "*_i686", "*-musllinux_*"]
build-frontend = "build[uv]"
test-requires = ["pytest"]
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.macos]
# x86_64 wheels; arm64 wheels always target macOS 11.0+
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.uv]
# `ref` holds the heavyweight reference implementations (torch, torchaudio) used only to
# validate tests/python/reference.py; opt in with `uv sync --group ref`.
default-groups = ["dev"]
# Managed CPython ships headers (Python.h), which the system python3 lacks.
python-preference = "managed"
# Rebuild the native extension on `uv sync` / `uv run` when C/C++ sources change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "csrc/**/*.c" },
  { file = "csrc/**/*.h" },
  { file = "src/asrfront/_ext.cpp" },
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["asrfront"]
known-local-folder = ["audio_signals", "helpers", "reference", "test_load"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
