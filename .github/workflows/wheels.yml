name: Wheels

# Release: bump the version (pyproject.toml + csrc/include/asrfront.h), commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# builds the sdist and all wheels, tests them and uploads them to PyPI.

on:
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Upload the built wheels and sdist to TestPyPI"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build and test wheels (config in pyproject.toml [tool.cibuildwheel])
        run: uvx --from "cibuildwheel>=3,<4" cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-testpypi:
    # Rehearsal: Actions -> Wheels -> Run workflow with "testpypi" checked.
    # Trusted publishing: register this repository / wheels.yml / environment "testpypi"
    # as a (pending) publisher on test.pypi.org first.
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # re-running for the same version is not an error

  publish:
    # Pushing a v* tag uploads to PyPI (only if the tag matches the version and every wheel
    # built and passed its tests). Trusted publishing: register this repository /
    # wheels.yml / environment "pypi" as a (pending) publisher on pypi.org first.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
